[tool.poetry]
name = "scalable_real2sim"
version = "0.1.0"
description = ""
authors = ["Nicholas Pfaff <nepfaff@mit.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.11"
# Blackwell port: upstream pinned a drake *nightly* (>=0.0.20250204,<1.0) because
# manipulation 2025.2.16 requires drake>=0.0.20250131,<0.1 (nightly-only). That is now
# unreachable: old nightlies are pruned, and current nightlies ship cp312/313/314 only
# -- no cp310, which this project requires. So move both to stable:
#   * drake stable ships cp310 wheels only up to 1.51.1
#   * manipulation >=2025.5.18 requires drake>=1.41.0
# 1.41.0 + manipulation 2025.5.18 is the satisfiable pairing closest to upstream's era,
# minimising API drift for code written against the Feb-2025 nightly.
drake = "1.41.0"
numpy = "^2.2.0"
scipy = "^1.15.1"
manipulation = "2025.5.18"  # Blackwell port: needs drake>=1.41.0 (see drake note above)
open3d = "^0.19.0"
sam2 = "^0.4.1"
transformers = {git = "https://github.com/huggingface/transformers.git", rev = "9c02cb6233eddedd8ecf0d48957cb481103f93f3"}
opencv-python = "^4.10.0.84"
accelerate = "^1.2.1"
# Blackwell port: torch 2.3.1/cu121 has no sm_120 kernels (RTX 5090 is cc 12.0).
# 2.7.1+cu128 is the first line with Blackwell support and the closest to upstream 2.3.1.
torch = { version = "2.7.1+cu128", source = "pytorch-cu128" }
clip = "^0.2.0"
timm = "^1.0.14"
coacd = "^1.0.5"
vhacdx = "^0.0.8.post2"
robot-payload-id = {path = "scalable_real2sim/robot_payload_id"}
torchvision = { version = "0.22.1+cu128", source = "pytorch-cu128" }
trimesh = "^4.6.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.4.0"
black = "23.9.1"
isort = "5.12.0"
poetry-pre-commit-plugin = "^0.1.2"

[[tool.poetry.source]]
name = "drake-nightly"
url = "https://drake-packages.csail.mit.edu/whl/nightly/"
priority = "explicit"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[tool.isort]
profile = 'black'
lines_between_types = 1
combine_as_imports = true
known_first_party = ['dynamic_mesh_distance']

[tool.autoflake]
in-place = true
recursive = true
expand-star-imports = true
ignore-init-module-imports = true
remove-all-unused-imports = true
remove-duplicate-keys = true
remove-unused-variables = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
